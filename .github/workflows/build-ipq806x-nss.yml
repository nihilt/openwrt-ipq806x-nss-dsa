name: Build ipq806x NSS images

on:
  push:
    branches:
      - 'ipq806x-nss-*'
      - 'dsa-main'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'README.openwrt.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.device }} (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    continue-on-error: ${{ matrix.experimental }}
    env:
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: netgear_r7800
            variant: std
            seed: diff            # name of the seed file in the repo root
            experimental: false

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget zstd

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/cache@v4 only saves when the whole job succeeds, so a failed build
      # lost everything. Restore here, save below with "if: always()".
      - name: Restore downloads cache
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ matrix.device }}-${{ hashFiles('feeds.conf.default', matrix.seed) }}
          restore-keys: dl-${{ matrix.device }}-

      # OpenWrt keeps the ccache in ./.ccache when CONFIG_CCACHE_DIR is empty.
      - name: Restore compiler cache (ccache)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ matrix.variant }}-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          unzip -o VHTNSS.zip

      - name: Configure
        run: |
          cp ${{ matrix.seed }} .config
          # ccache is enabled for CI only, so local builds of the seed are unaffected
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      # Warn about seed lines that "make defconfig" silently dropped (renamed or
      # removed packages, unmet dependencies). Checked before the long build.
      - name: Check seed survived defconfig
        run: |
          grep '^CONFIG_' "${{ matrix.seed }}" | sed 's/[[:space:]]*$//' > seed.lines
          : > dropped.txt
          while IFS= read -r line; do
            grep -qxF -- "$line" .config || echo "$line" >> dropped.txt
          done < seed.lines
          if [ -s dropped.txt ]; then
            while IFS= read -r line; do
              echo "::warning::dropped by defconfig: $line"
            done < dropped.txt
            {
              echo "### Seed lines dropped by defconfig (${{ matrix.variant }})"
              echo '```'
              cat dropped.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All seed lines survived defconfig."
          fi
          rm -f seed.lines dropped.txt

      - name: Download sources
        run: make -j8 download

      - name: Build
        run: |
          make -j$(nproc) || {
            echo "::warning::parallel build failed, rerunning with -j1 V=s"
            make -j1 V=s 2>&1 | tail -n 300
            exit 1
          }

      # These run even when the build failed, so the next attempt starts warm.
      - name: Save downloads cache
        if: always() && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ matrix.device }}-${{ hashFiles('feeds.conf.default', matrix.seed) }}

      - name: Save compiler cache (ccache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}

      - name: Collect images
        run: |
          mkdir -p out
          cp bin/targets/ipq806x/generic/openwrt-nss-*-${{ matrix.device }}-* out/
          cp bin/targets/ipq806x/generic/openwrt-nss-*-${{ matrix.device }}.manifest out/
          # Variants other than "std" get their name in the file names so releases never collide.
          if [ "${{ matrix.variant }}" != "std" ]; then
            for f in out/*; do
              mv "$f" "out/$(basename "$f" | sed 's/^openwrt-nss-/openwrt-nss-${{ matrix.variant }}-/')"
            done
          fi
          (cd out && sha256sum * > sha256sums-${{ matrix.device }}-${{ matrix.variant }})
          ls -la out

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nss-${{ matrix.device }}-${{ matrix.variant }}
          path: out/
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "OpenWrt NSS ${{ github.ref_name }}" \
            --notes "Images for the Netgear R7800, built from OpenWrt master. See the README for the test status."